global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:3000']
        labels: { role: api }

  # Compose replicas share a service name; DNS returns every replica's address,
  # so this one entry scrapes all three schedulers.
  - job_name: scheduler
    dns_sd_configs:
      - names: ['scheduler']
        type: A
        port: 3001
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: role
        replacement: scheduler
